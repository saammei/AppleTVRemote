name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    env:
      # python-build-standalone 版本(与 astral-sh 的 release tag 一致)
      PYTHON_TAG: "3.12.14+20260814"

    steps:
      - uses: actions/checkout@v4

      - name: 计算版本号
        run: |
          if [[ "${GITHUB_REF_NAME}" == v* ]]; then
            echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          else
            echo "VERSION=dev" >> "$GITHUB_ENV"
          fi

      - name: 构建通用二进制 (Release)
        run: |
          xcodebuild -project AppleTVRemote.xcodeproj -scheme AppleTVRemote \
            -configuration Release -derivedDataPath DerivedData \
            ARCHS="arm64 x86_64" ONLY_ACTIVE_ARCH=NO \
            CODE_SIGN_IDENTITY="-" MARKETING_VERSION="$VERSION" \
            build
          cp -R DerivedData/Build/Products/Release/AppleTVRemote.app "$RUNNER_TEMP/AppleTVRemote.app"

      - name: 内嵌 Python 运行时 (arm64)
        run: |
          curl -fL -o /tmp/python-arm64.tar.gz \
            "https://github.com/astral-sh/python-build-standalone/releases/download/${PYTHON_TAG}/cpython-${PYTHON_TAG}-aarch64-apple-darwin-install_only.tar.gz"
          mkdir -p /tmp/python-arm64
          tar -xzf /tmp/python-arm64.tar.gz -C /tmp/python-arm64
          mv /tmp/python-arm64/python "$RUNNER_TEMP/AppleTVRemote.app/Contents/Resources/python-arm64"

      - name: 内嵌 Python 运行时 (x86_64)
        run: |
          curl -fL -o /tmp/python-x86_64.tar.gz \
            "https://github.com/astral-sh/python-build-standalone/releases/download/${PYTHON_TAG}/cpython-${PYTHON_TAG}-x86_64-apple-darwin-install_only.tar.gz"
          mkdir -p /tmp/python-x86_64
          tar -xzf /tmp/python-x86_64.tar.gz -C /tmp/python-x86_64
          mv /tmp/python-x86_64/python "$RUNNER_TEMP/AppleTVRemote.app/Contents/Resources/python-x86_64"

      - name: 安装 pyatv 依赖
        run: |
          "$RUNNER_TEMP/AppleTVRemote.app/Contents/Resources/python-arm64/bin/python3" -m pip install --no-cache-dir -r requirements.txt
          "$RUNNER_TEMP/AppleTVRemote.app/Contents/Resources/python-x86_64/bin/python3" -m pip install --no-cache-dir -r requirements.txt

      - name: 签名 (ad-hoc)
        run: codesign --force --deep --sign - "$RUNNER_TEMP/AppleTVRemote.app"

      - name: 打包 DMG
        run: |
          mkdir -p "$RUNNER_TEMP/dmg"
          cp -R "$RUNNER_TEMP/AppleTVRemote.app" "$RUNNER_TEMP/dmg/"
          ln -s /Applications "$RUNNER_TEMP/dmg/Applications"
          hdiutil create -volname "AppleTVRemote" -srcfolder "$RUNNER_TEMP/dmg" \
            -ov -format UDZO "AppleTVRemote-${VERSION}.dmg"
          ls -lh AppleTVRemote-*.dmg

      - name: 上传构建产物 (手动触发)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: AppleTVRemote-${{ env.VERSION }}.dmg
          path: AppleTVRemote-*.dmg

      - name: 发布 GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: AppleTVRemote-*.dmg
          generate_release_notes: true

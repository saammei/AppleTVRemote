name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15

    steps:
      - uses: actions/checkout@v4

      - name: Compute version
        run: |
          if [[ "${GITHUB_REF_NAME}" == v* ]]; then
            echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          else
            echo "VERSION=dev" >> "$GITHUB_ENV"
          fi

      - name: Protocol stack self-test
        run: |
          cd AppleTVControl
          swift run AppleTVControlTests

      - name: Build app (arm64, Release)
        run: |
          xcodebuild -project AppleTVRemote.xcodeproj -scheme AppleTVRemote \
            -configuration Release -derivedDataPath DerivedData \
            ARCHS=arm64 ONLY_ACTIVE_ARCH=NO \
            CODE_SIGN_IDENTITY="-" MARKETING_VERSION="$VERSION" \
            build
          cp -R DerivedData/Build/Products/Release/AppleTVRemote.app "$RUNNER_TEMP/AppleTVRemote.app"

      - name: Sign (ad-hoc)
        run: codesign --force --deep --sign - "$RUNNER_TEMP/AppleTVRemote.app"

      - name: Package DMG
        run: |
          mkdir -p "$RUNNER_TEMP/dmg"
          cp -R "$RUNNER_TEMP/AppleTVRemote.app" "$RUNNER_TEMP/dmg/"
          ln -s /Applications "$RUNNER_TEMP/dmg/Applications"
          hdiutil create -volname "AppleTVRemote" -srcfolder "$RUNNER_TEMP/dmg" \
            -ov -format UDZO "AppleTVRemote-${VERSION}.dmg"
          echo "== DMG size =="
          ls -lh AppleTVRemote-*.dmg

      - name: Upload build artifact (manual trigger)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: AppleTVRemote-${{ env.VERSION }}.dmg
          path: AppleTVRemote-*.dmg

      - name: Generate release description
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          cat > "$RUNNER_TEMP/release_body.md" <<'EOF'
          ## Installation

          1. Download and open `AppleTVRemote-<VERSION>.dmg`
          2. Drag `AppleTVRemote` into the Applications folder
          3. First launch: the app is not signed with an Apple Developer certificate (free distribution), so macOS blocks it once. Allow it either way below (only needed once; after that it opens normally):

             **Option 1: Allow via System Settings (recommended, no terminal needed)**
             1. Double-click the icon; when "Apple cannot verify…" appears, click **OK**
             2. Open **System Settings → Privacy & Security**, scroll to the Security section at the bottom
             3. Find **AppleTVRemote**, click **Open Anyway**, then click **Open** in the confirmation dialog
             4. ⚠️ If the app is not listed yet, double-click the icon in the Applications folder **again**, then reopen System Settings and the option will appear

             **Option 2: Allow from the command line**

          ```bash
          xattr -dr com.apple.quarantine "/Applications/AppleTVRemote.app"
          ```

          4. The app has no Dock icon; after launching, it appears only as a remote icon in the menu bar at the top-right

          ---

          ## What's New
          EOF
          sed -i '' "s/<VERSION>/$VERSION/g" "$RUNNER_TEMP/release_body.md"
          # Append auto-generated release notes (based on commits since the previous tag; on failure, keep only the installation instructions)
          gh api -X POST "/repos/${GITHUB_REPOSITORY}/releases/generate-notes" \
            -f tag_name="${GITHUB_REF_NAME}" -f target_commitish="${GITHUB_SHA}" \
            --jq '.body' > "$RUNNER_TEMP/release_notes.md" 2>/dev/null \
            && cat "$RUNNER_TEMP/release_notes.md" >> "$RUNNER_TEMP/release_body.md" || true
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: AppleTVRemote-*.dmg
          body_path: "${{ runner.temp }}/release_body.md"
